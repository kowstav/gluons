name: Prototype checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r packages/automation-bridge/requirements.txt
      - run: python packages/automation-bridge/test_invoice.py
      - run: npm run skills:export
      - run: git diff --exit-code -- skills supabase/seed.sql
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-diagnostics
          path: |
            playwright-report/
            test-results/
